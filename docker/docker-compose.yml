version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: ${CONTAINER_PREFIX:-birth-rectifier}-frontend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=http://api-gateway:8000
      - NEXT_PUBLIC_API_SERVICE_URL=http://api-gateway:8000
      - NEXT_PUBLIC_WS_URL=ws://api-gateway:8000/ws
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - API_URL=http://api_gateway:8000
      - API_SERVICE_URL=http://api_gateway:8000
      - WS_URL=ws://api_gateway:8000/ws
    ports:
      - "3000:3000"
    command: ["npm", "run", "start"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: ${HEALTH_CHECK_INTERVAL:-15s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-30s}
    depends_on:
      api_gateway:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
    networks:
      - app-network

  api_gateway:
    build:
      context: ..
      dockerfile: docker/api_gateway.Dockerfile
      target: production
    container_name: ${CONTAINER_PREFIX:-birth-rectifier}-api-gateway
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${APP_ENV:-production}
      - APP_ENV=${APP_ENV:-production}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_WS_URL=ws://ai-service:8000/ws
      - WS_PING_INTERVAL=${WS_PING_INTERVAL:-20}
      - WS_PING_TIMEOUT=${WS_PING_TIMEOUT:-20}
      - WS_MAX_SIZE=${WS_MAX_SIZE:-16777216}
      - WS_MAX_QUEUE=${WS_MAX_QUEUE:-32}
      - WS_HEARTBEAT_INTERVAL=${WS_HEARTBEAT_INTERVAL:-30}
      - WS_RETRY_ATTEMPTS=${WS_RETRY_ATTEMPTS:-5}
      - WS_RETRY_DELAY=${WS_RETRY_DELAY:-2}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    ports:
      - "9000:8000"  # HTTP API
      - "9001:8000"  # WebSocket connections
    command: ["python", "-m", "uvicorn", "api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: ${HEALTH_CHECK_INTERVAL:-15s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-15s}
      retries: ${HEALTH_CHECK_RETRIES:-5}
      start_period: ${HEALTH_CHECK_START_PERIOD:-30s}
    depends_on:
      redis:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
    networks:
      - app-network

  ai_service:
    build:
      context: ..
      dockerfile: docker/ai_service.Dockerfile
    container_name: ${CONTAINER_PREFIX:-birth-rectifier}-ai
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${APP_ENV:-production}
      - APP_ENV=${APP_ENV:-production}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SWISSEPH_PATH=/app/ephemeris
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_TIMEOUT=${API_TIMEOUT:-60}
      - CACHE_EXPIRY=${CACHE_EXPIRY:-3600}
      - CACHE_DIR=/app/cache
      - GPU_MEMORY_FRACTION=${GPU_MEMORY_FRACTION:-0.7}
      - MODEL_CACHE_SIZE=${MODEL_CACHE_SIZE:-100}
      - OPENAI_MODEL_RECTIFICATION=${OPENAI_MODEL_RECTIFICATION:-gpt-4-turbo}
      - OPENAI_MODEL_EXPLANATION=${OPENAI_MODEL_EXPLANATION:-gpt-4-turbo}
      - OPENAI_MODEL_AUXILIARY=${OPENAI_MODEL_AUXILIARY:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.7}
      - ENABLE_MODEL_PRELOADING=${ENABLE_MODEL_PRELOADING:-true}
      - ENABLE_CACHE=${ENABLE_CACHE:-true}
      - CACHE_TTL=${CACHE_TTL:-3600}
      - REQUEST_RETRY_ATTEMPTS=${REQUEST_RETRY_ATTEMPTS:-3}
      - REQUEST_RETRY_BACKOFF=${REQUEST_RETRY_BACKOFF:-2}
      - TIMEZONE_API_KEY=${TIMEZONE_API_KEY}
      - GPU_ENABLED=${GPU_ENABLED:-false}
      - WS_PING_INTERVAL=${WS_PING_INTERVAL:-20}
      - WS_PING_TIMEOUT=${WS_PING_TIMEOUT:-20}
      - WS_MAX_SIZE=${WS_MAX_SIZE:-16777216}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-birth_time_rectifier}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - SKIP_DB_INIT=true
    ports:
      - "8000:8000"
    volumes:
      - ../ai_service:/app/ai_service
      - ../scripts:/app/scripts
      - ../tests:/app/tests
      - ephemeris-data:/app/ephemeris
      - media-data:/app/media
      - temp-data:/app/temp
      - exports-data:/app/exports
      - logs-data:/app/logs
    env_file:
      - ../env/.env
    command: ["python", "-m", "uvicorn", "ai_service.app_wrapper:app_wrapper", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: ${HEALTH_CHECK_INTERVAL:-15s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-15s}
      retries: ${HEALTH_CHECK_RETRIES:-5}
      start_period: ${HEALTH_CHECK_START_PERIOD:-30s}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: ${CONTAINER_PREFIX:-birth-rectifier}-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ../config/docker/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:14-alpine
    container_name: ${CONTAINER_PREFIX:-birth-rectifier}-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-birth_time_rectifier}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - app-network

volumes:
  redis-data:
  postgres_data:
  ephemeris-data:
  media-data:
  temp-data:
  exports-data:
  logs-data:

networks:
  app-network:
    driver: bridge
